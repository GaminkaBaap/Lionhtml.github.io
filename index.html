<!DOCTYPE html>
<html>
<head>
    <title>Login Register</title>
    <style>
        body { font-family: Arial; padding: 50px; background: #f2f2f2; text-align: center; }
        .box { background: white; padding: 30px; border-radius: 10px; width: 320px; margin: 20px auto; box-shadow: 0 0 10px #ccc; }
        input { display: block; margin: 10px auto; padding: 12px; width: 90%; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 25px; margin: 8px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; }
        button:hover { background: #0056b3; }
        #user { display: none; }
    </style>
</head>
<body>

    <div class="box" id="login-box">
      <h2>Register</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="register()">Register</button>

      <hr>

      <h2>Login</h2>
      <input type="email" id="email2" placeholder="Email">
      <input type="password" id="password2" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

    <div class="box" id="user">
      <h3>Welcome!</h3>
      <p><span id="user-email"></span></p>
      <button onclick="logout()">Logout</button>
    </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCizcfTTN0k5GHuIPz0aojJ3QR",
    authDomain: "lion-login-html.firebaseapp.com",
    projectId: "lion-login-html",
    storageBucket: "lion-login-html.appspot.com",
    messagingSenderId: "446370779992",
    appId: "1:446370779992:web:86fe9eb5176f05",
    measurementId: "G-8C67Z75SHX"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.register = () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    createUserWithEmailAndPassword(auth, email, password)
    .then(() => alert("Register Success!"))
    .catch((e) => alert("Error: " + e.message));
  }

  window.login = () => {
    const email = document.getElementById('email2').value;
    const password = document.getElementById('password2').value;
    signInWithEmailAndPassword(auth, email, password)
    .then(() => alert("Login Success!"))
    .catch((e) => alert("Error: " + e.message));
  }

  window.logout = () => { signOut(auth); }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('user').style.display = 'block';
      document.getElementById('user-email').innerText = user.email;
    } else {
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('user').style.display = 'none';
    }
  });
</script>

</body>
</html>
